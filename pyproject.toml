[project]
name = "argus-log-intelligence-platform"
version = "0.1.0"
description = "Log intelligence platform for parsing, streaming, and anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Mark Christian Anub" }]
dependencies = [
  "torch>=2.1.0,<3.0.0",
  "transformers>=4.37.0,<5.0.0",
  "drain3>=0.9.11,<1.0.0",
  "confluent-kafka>=2.4.0,<3.0.0",
  "elasticsearch>=8.12.0,<9.0.0",
  "redis[hiredis]>=5.0.0,<8.0.0",
  "fastapi>=0.115.6,<1.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
  "mlflow>=2.12.2,<2.16.0",
  "pydantic>=2.13.4,<3.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "pandas>=2.1.0,<3.0.0",
  "tqdm>=4.67.1,<5.0.0",
  "pyarrow>=14.0.0,<16.0.0",
  "numpy>=1.26.0,<3.0.0",
  "scikit-learn>=1.4.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=0.23.0,<2.0.0"
httpx = ">=0.27.0,<1.0.0"
ruff = ">=0.8.0,<1.0.0"
pip-audit = ">=2.7.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
