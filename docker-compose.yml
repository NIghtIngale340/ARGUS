services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.4
    environment:
      SERVER_NAME: kibana
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "/mlflow/mlruns", "--default-artifact-root", "/mlflow/artifacts"]
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.4
    command: ["logstash", "-f", "/usr/share/logstash/pipeline/argus.conf"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/logstash/argus.conf:/usr/share/logstash/pipeline/argus.conf:ro
      - logstash_data:/usr/share/logstash/data
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ES_URL: http://elasticsearch:9200
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      MLFLOW_URI: http://mlflow:5000
      ARGUS_PHASE3_BUNDLE_DIR: /app/data/argus_phase3_model_bundle
      ARGUS_PHASE3_THRESHOLD: ${ARGUS_PHASE3_THRESHOLD:-}
      ARGUS_API_KEY: ${ARGUS_API_KEY:-change-me-local-demo-key}
      ARGUS_ADMIN_API_KEY: ${ARGUS_ADMIN_API_KEY:-change-me-local-admin-key}
      ARGUS_DASHBOARD_USERNAME: ${ARGUS_DASHBOARD_USERNAME:-argus}
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      ARGUS_TRUSTED_HOSTS: ${ARGUS_TRUSTED_HOSTS:-127.0.0.1,localhost,testserver}
      ARGUS_MAX_REQUEST_BYTES: ${ARGUS_MAX_REQUEST_BYTES:-1048576}
      ARGUS_RATE_LIMIT_ENABLED: ${ARGUS_RATE_LIMIT_ENABLED:-true}
      ARGUS_RATE_LIMIT_PER_MINUTE: ${ARGUS_RATE_LIMIT_PER_MINUTE:-120}
      ARGUS_RATE_LIMIT_USE_REDIS: ${ARGUS_RATE_LIMIT_USE_REDIS:-false}
      ARGUS_RATE_LIMIT_REDIS_URL: ${ARGUS_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
      ARGUS_STREAM_SESSION_MAX_TOKENS: ${ARGUS_STREAM_SESSION_MAX_TOKENS:-}
      ARGUS_USE_REDIS_UEBA: "true"
      ARGUS_USE_ELASTICSEARCH_ALERTS: "true"
      ARGUS_ALERT_INDEX_PREFIX: argus-alerts
      LOG_LEVEL: INFO
      ENV: development
    volumes:
      - ./data/argus_phase3_model_bundle:/app/data/argus_phase3_model_bundle:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      MLFLOW_URI: http://mlflow:5000
      ES_URL: http://elasticsearch:9200
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ARGUS_PHASE3_BUNDLE_DIR: /app/data/argus_phase3_model_bundle
      ARGUS_PHASE3_THRESHOLD: ${ARGUS_PHASE3_THRESHOLD:-}
      ARGUS_STREAM_SESSION_MAX_TOKENS: ${ARGUS_STREAM_SESSION_MAX_TOKENS:-}
      ARGUS_USE_REDIS_UEBA: "true"
      ARGUS_USE_ELASTICSEARCH_ALERTS: "true"
      ARGUS_ALERT_INDEX_PREFIX: argus-alerts
      ARGUS_RAW_LOG_TOPIC: argus.raw-logs
      ARGUS_DETECTIONS_TOPIC: argus.detections
      ARGUS_DEAD_LETTER_TOPIC: ${ARGUS_DEAD_LETTER_TOPIC:-argus.dead-letter}
    volumes:
      - ./data/argus_phase3_model_bundle:/app/data/argus_phase3_model_bundle:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/python -c \"from pathlib import Path; import sys; cmd = Path('/proc/1/cmdline').read_text(errors='ignore'); sys.exit(0 if 'scripts.run_phase4_streaming_consumer' in cmd else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  esdata:
  zookeeper_data:
  kafka_data:
  redis_data:
  mlflow_data:
  logstash_data:

networks:
  argus-net:
    driver: bridge
