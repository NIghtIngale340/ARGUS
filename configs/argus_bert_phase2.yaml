model:
  name: "ARGUS-BERT"
  vocab_size: 1233
  max_seq_len: 16
  hidden_size: 256
  num_hidden_layers: 6
  num_attention_heads: 8
  intermediate_size: 1024
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  pad_token_id: 3
  mask_token_id: 2

data:
  dataset: "nightingale21/argus-tokenized-58day-verified"
  tokenized_root: "/kaggle/input/datasets/nightingale21/argus-tokenized-58day-verified/data/tokenized"
  train_manifest: "sessions_train.pt"
  val_manifest: "sessions_val.pt"
  test_manifest: "sessions_test.pt"
  manifest_format: "tokenized_session_chunk_manifest_v1"
  chunk_format: "tokenized_session_chunk_v1"
  limit_chunks:
  limit_sessions:

mlm:
  mask_probability: 0.15
  mask_token_probability: 0.80
  random_token_probability: 0.10
  unchanged_probability: 0.10
  ignore_index: -100

training:
  batch_size: 64
  learning_rate: 0.0001
  warmup_steps: 10000
  max_epochs: 1
  gradient_accumulation_steps: 1
  output_dir: "/kaggle/working/argus_mlm_checkpoints"
